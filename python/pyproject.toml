[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "leankedin-park"
dynamic = ["version"]
description = "Python bindings for leankedin-park (LinkedIn Voyager API)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "License :: Other/Proprietary License",
]

[project.urls]
Repository = "https://github.com/D4RK-PARADIS3/leankedin-park"
Issues = "https://github.com/D4RK-PARADIS3/leankedin-park/issues"

[tool.maturin]
bindings = "pyo3"
