name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: '1.99.0'
  MATURIN_VERSION: '1.15.0'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci
      - name: Install native build dependencies and metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config
          python -m pip install packaging tomli
      - name: Check formatting and package configuration
        run: |
          cargo fmt --all -- --check
          python .github/scripts/check_dist.py --config-only
          python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check Rust and run offline regression tests
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Build Python extension
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python
          maturin-version: ${{ env.MATURIN_VERSION }}
          manylinux: 'off'
          args: --locked --out ../dist
      - name: Test installed Python extension without accessing LinkedIn
        run: |
          python -m pip install --pre --no-index --only-binary=:all: --find-links dist leankedin-park
          python -m unittest discover -s python -p 'test_search_validation.py'
          python -m unittest discover -s python -p 'test_stub_contract.py'
